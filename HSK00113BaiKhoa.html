<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 13 - BÀI KHÓA</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f9fbff);
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(900px,96vw); padding:20px 0 30px}
h1{text-align:center;margin:0 0 6px;font-size:32px}
.subtitle{text-align:center;color:#666;margin-bottom:14px;font-size:18px}
.progress{text-align:center;font-size:18px;color:#666;margin-bottom:12px}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:750px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 12px 35px rgba(30,60,100,.15);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:32px 36px; border:1px solid #e6eaf0; overflow:hidden;
}
.back{transform:rotateY(180deg)}

.card-content {
  flex: 1;
  overflow-y: auto;
  padding-right: 8px;
}

.context-title {
  font-weight: bold;
  margin-bottom: 20px;
  font-size: 22px;
  color: #2c3e50;
  line-height: 1.5;
  border-bottom: 2px solid #edf2f7;
  padding-bottom: 12px;
}
.dialogue-table {
  width: 100%;
  border-collapse: collapse;
}
.dialogue-table td {
  vertical-align: top;
  padding: 10px 0;
}
.speaker-col {
  width: 140px;
  color: #000000;
  font-weight: bold;
  font-size: 24px;
  white-space: nowrap;
}
.speaker-col-front {
  width: 140px;
  color: #718096;
  font-weight: bold;
  font-size: 40.5px;
  white-space: nowrap;
}
.speech-col {
  color: #e53e3e;
  font-weight: bold;
  font-size: 40.5px;
  line-height: 1.5;
}
.speech-col-back {
  color: #e53e3e;
  font-weight: bold;
  font-size: 27px;
  line-height: 1.5;
}
.pinyin-block {
  color: #718096;
  font-weight: bold;
  font-size: 22px;
  margin-top: 4px;
  margin-bottom: 4px;
  display: block;
}
.meaning-text {
  font-size: 21px;
  color: #4b5563;
  font-weight: normal;
  margin-top: 4px;
}

.audio-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 22px;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 50%;
  transition: background-color 0.2s;
  vertical-align: middle;
}
.audio-btn:hover {
  background-color: #edf2f7;
}

.hint{color:#888; font-size:18px; text-align:center; margin-top:14px}
.controls{display:flex;gap:16px;justify-content:center;margin-top:22px}
button{
  border:0;border-radius:14px;padding:16px 26px;font-size:20px;
  cursor:pointer;background:#e9eef7;color:#233044;
}
button.primary{background:#2563eb;color:white}
button:hover{filter:brightness(.97)}
.extra{display:flex;justify-content:center;gap:10px;margin-top:14px}
.shuffle{background:#e9f8ef}

@media(max-width:600px){
 .app{padding-top:16px}.card{height:780px}
 .face{padding:22px 20px}
 .context-title{font-size:18px; margin-bottom:14px}
 .speaker-col{width:100px; font-size:18px}
 .speaker-col-front{width:100px; font-size:30px}
 .speech-col{font-size:30px}
 .speech-col-back{font-size:20px}
 .pinyin-block{font-size:17px;}
 .meaning-text{font-size:16px}
 .controls button{padding:12px 16px; font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🇨🇳 BÀI 13 - BÀI KHÓA</h1>

  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="card-content" id="frontContent"></div>
      </div>
      <div class="face back">
        <div class="card-content" id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← Trước</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">Lật thẻ</button>
    <button onclick="event.stopPropagation();nextCard()">Tiếp →</button>
  </div>
  <div class="extra">
    <button class="shuffle" onclick="event.stopPropagation();shuffleCards()">🔀 Trộn thẻ</button>
  </div>
</div>

<script>
const originalCards = [
  {
    "frontContext": "BÀI KHÓA 1: Sau giờ học, Bạch Gia Nguyệt (Bái Jiāyuè) hỏi cô giáo Vương (Wáng lǎoshī)",
    "frontLines": [
      { "speaker": "白家月:", "speech": "王老师，我可以再问您一个问题吗？" },
      { "speaker": "王一飞:", "speech": "可以。你有什么问题？" },
      { "speaker": "白家月:", "speech": "那个小店卖不卖手机？" },
      { "speaker": "王一飞:", "speech": "我不知道。你可以打电话问一下。" }
    ],
    "backLines": [
      { "speaker": "白家月:", "speech": "王老师，我可以再问您一个问题吗？", "pinyin": "Wáng lǎoshī, wǒ kěyǐ zài wèn nín yī gè wèntí ma?", "meaning": "Cô Vương, em có thể hỏi cô thêm một câu hỏi nữa không ạ?" },
      { "speaker": "王一飞:", "speech": "可以。你有什么问题？", "pinyin": "Kěyǐ. Nǐ yǒu shénme wèntí?", "meaning": "Được. Em có câu hỏi gì?" },
      { "speaker": "白家月:", "speech": "那个小店卖不卖手机？", "pinyin": "Nàge xiǎodiàn mài bu mài shǒujī?", "meaning": "Cửa hàng nhỏ đó có bán điện thoại di động không?" },
      { "speaker": "王一飞:", "speech": "我不知道。你可以打电话问一下。", "pinyin": "Wǒ bù zhīdào. Nǐ kěyǐ dǎ diànhuà wèn yīxià.", "meaning": "Tôi không biết. Em có thể gọi điện thoại hỏi thử xem." }
    ]
  },
  {
    "frontContext": "BÀI KHÓA 2: Trong quán cà phê, Vương Nhất Tuyết (Wáng Yīxuě) muốn ăn sáng.",
    "frontLines": [
      { "speaker": "服务员:", "speech": "女士，请坐！您喝什么？" },
      { "speaker": "王一雪:", "speech": "我看一下。请给我一杯牛奶。" },
      { "speaker": "服务员:", "speech": "好的。您还要什么？" },
      { "speaker": "王一雪:", "speech": "我还没吃早饭，再要这个面包和鸡蛋吧。" }
    ],
    "backLines": [
      { "speaker": "服务员:", "speech": "女士，请坐！您喝什么？", "pinyin": "Nǚshì, qǐng zuò! Nín hē shénme?", "meaning": "Quý cô, mời ngồi! Cô uống gì ạ?" },
      { "speaker": "王一雪:", "speech": "我看一下。请给我一杯牛奶。", "pinyin": "Wǒ kàn yīxià. Qǐng gěi wǒ yì bēi niúnǎi.", "meaning": "Để tôi xem một chút. Làm ơn cho tôi một ly sữa." },
      { "speaker": "服务员:", "speech": "好的。您还要什么？", "pinyin": "Hǎo de. Nín hái yào shénme?", "meaning": "Được ạ. Cô còn muốn gì nữa không?" },
      { "speaker": "王一雪:", "speech": "我还没吃早饭，再要这个面包和鸡蛋吧。", "pinyin": "Wǒ hái méi chī zǎofàn, zài yào zhège miànbāo hé jīdàn ba.", "meaning": "Tôi vẫn chưa ăn sáng, lấy thêm bánh mì và trứng này nữa nhé." }
    ]
  },
  {
    "frontContext": "BÀI KHÓA 3: Trong nhà hàng, Lưu Minh (Liú Míng) đang gọi món.",
    "frontLines": [
      { "speaker": "服务员:", "speech": "先生，请坐！您要什么？" },
      { "speaker": "刘明:", "speech": "我要一斤饺子。" },
      { "speaker": "服务员:", "speech": "好的。一斤饺子40个。" },
      { "speaker": "刘明:", "speech": "40个太多了，我要一半吧。" },
      { "speaker": "服务员:", "speech": "半斤20个。您想喝什么？" },
      { "speaker": "刘明:", "speech": "请给我一杯茶吧。" }
    ],
    "backLines": [
      { "speaker": "服务员:", "speech": "先生，请坐！您要什么？", "pinyin": "Xiānsheng, qǐng zuò! Nín yào shénme?", "meaning": "Chào anh, mời ngồi! Anh gọi gì ạ?" },
      { "speaker": "刘明:", "speech": "我要一斤饺子。", "pinyin": "Wǒ yào yì jīn jiǎozi.", "meaning": "Tôi muốn một cân sủi cảo." },
      { "speaker": "服务员:", "speech": "好的。一斤饺子40个。", "pinyin": "Hǎo de. Yì jīn jiǎozi sìshí gè.", "meaning": "Được ạ. Một cân sủi cảo có 40 cái." },
      { "speaker": "刘明:", "speech": "40个太多了，我要一半吧。", "pinyin": "Sìshí gè tài duō le, wǒ yào yībàn ba.", "meaning": "40 cái nhiều quá, tôi lấy một nửa thôi." },
      { "speaker": "服务员:", "speech": "半斤20个。您想喝什么？", "pinyin": "Bàn jīn èrshí gè. Nín xiǎng hē shénme?", "meaning": "Nửa cân là 20 cái. Anh muốn uống gì?" },
      { "speaker": "刘明:", "speech": "请给我一杯茶吧。", "pinyin": "Qǐng gěi wǒ yì bēi chá ba.", "meaning": "Làm ơn cho tôi một ly trà nhé." }
    ]
  }
];

let cards = [...originalCards];
let index = 0;
let flipped = false;

function speakText(event, text) {
  event.stopPropagation();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    alert('Trình duyệt của bạn không hỗ trợ tính năng phát âm.');
  }
}

function render(){
  const c = cards[index];
  
  let frontHtml = `<div class="context-title">${c.frontContext}</div><table class="dialogue-table">`;
  c.frontLines.forEach(line => {
    frontHtml += `
      <tr>
        <td class="speaker-col-front">${line.speaker}</td>
        <td class="speech-col">
          ${line.speech}
          <button class="audio-btn" onclick="speakText(event, '${line.speech.replace(/'/g, "\\'")}')" title="Nghe phát âm">🔊</button>
        </td>
      </tr>`;
  });
  frontHtml += `</table>`;
  document.getElementById('frontContent').innerHTML = frontHtml;

  let backHtml = `<div class="context-title">${c.frontContext}</div><table class="dialogue-table">`;
  c.backLines.forEach(line => {
    backHtml += `
      <tr>
        <td class="speaker-col">${line.speaker}</td>
        <td class="speech-col-back">
          ${line.speech}
          <button class="audio-btn" onclick="speakText(event, '${line.speech.replace(/'/g, "\\'")}')" title="Nghe phát âm">🔊</button>
          <div class="pinyin-block">${line.pinyin}</div>
          <div class="meaning-text">${line.meaning}</div>
        </td>
      </tr>`;
  });
  backHtml += `</table>`;
  document.getElementById('backContent').innerHTML = backHtml;

  document.getElementById('progress').textContent = `Thẻ ${index+1} / ${cards.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function flipCard(){
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function nextCard(){
  index = (index + 1) % cards.length;
  flipped = false; render();
}

function prevCard(){
  index = (index - 1 + cards.length) % cards.length;
  flipped = false; render();
}

function shuffleCards(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; flipped=false; render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    flipCard();
  }
});

render();
</script>
</body>
</html>
